[project]
name = "product-matcher"
version = "0.6.0"
description = "Find the same Amazon.in product on Flipkart, Croma and Myntra, and report its stock status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.13",
    "fastapi>=0.118",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rapidfuzz>=3.13",
    "selectolax>=1.0",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test doubles live in tests/support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real Amazon/Flipkart/Croma/Myntra sites (deselected by default; run with `-m live`)",
]
addopts = "-m 'not live' --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "RET", "TC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes (₹, ×, curly quotes) are real data here

[tool.ruff.lint.isort]
known-first-party = ["app", "support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "curl_cffi.*", "rapidfuzz.*", "playwright.*"]
ignore_missing_imports = true
