# "Deploy to DigitalOcean" button template (App Platform). The button reads this file from the repository;
# everything must sit under `spec:`. Bangalore keeps the app in India, where Flipkart accepts it.
spec:
  name: product-matcher
  region: blr
  services:
    - name: web
      git:
        repo_clone_url: https://github.com/Deepanshusaxena1/product-matcher.git
        branch: main
      dockerfile_path: Dockerfile
      http_port: 8000
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      health_check:
        http_path: /api/health
        initial_delay_seconds: 10
        timeout_seconds: 5
      envs:
        - key: MATCHER_CROMA_PINCODE
          value: "400001"
          scope: RUN_TIME
